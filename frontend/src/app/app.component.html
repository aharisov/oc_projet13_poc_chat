<h1>Your Car Your Way - Chat PoC</h1>

<div>
  <label for="conversationId">Conversation</label>
  <input
    id="conversationId"
    type="text"
    [(ngModel)]="conversationId"
    [disabled]="connected"
  />
</div>

<div>
  <label for="sender">Nom</label>
  <input
    id="sender"
    type="text"
    [(ngModel)]="sender"
    [disabled]="connected"
  />
</div>

<div>
  <label for="role">Rôle</label>
  <select
    id="role"
    [(ngModel)]="role"
    [disabled]="connected"
  >
    <option value="CUSTOMER">Client</option>
    <option value="ADVISER">Service client</option>
  </select>
</div>

<div>
  @if (!connected) {
    <button type="button" (click)="connect()">
      Se connecter
    </button>
  } @else {
    <button type="button" (click)="disconnect()">
      Se déconnecter
    </button>
  }
</div>

<p>
  Statut :
  <strong>
    {{ connected ? 'Connecté' : 'Déconnecté' }}
  </strong>
</p>

<hr />

<div>
  @for (message of messages; track $index) {
    <p>
      <strong>{{ message.sender }}</strong>
      ({{ message.role }})
      :
      {{ message.content }}

      @if (message.timestamp) {
        <small>
          {{ message.timestamp }}
        </small>
      }
    </p>
  }
</div>

<div>
  <input
    type="text"
    [(ngModel)]="messageContent"
    placeholder="Votre message"
    [disabled]="!connected"
    (keyup.enter)="sendMessage()"
  />

  <button
    type="button"
    (click)="sendMessage()"
    [disabled]="!connected || !messageContent.trim()"
  >
    Envoyer
  </button>
</div>
